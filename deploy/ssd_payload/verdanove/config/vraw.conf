# ==============================================================================
# Verdanove RAW Capture Engine Configuration for Atomos Ninja V
# Target: Zynq UltraScale+ (Quad Cortex-A53 / Dual Cortex-R5)
# Mode: 12-Bit Uncompressed CinemaDNG (Bayer RGGB)
# ==============================================================================

# Sensor & Resolution
WIDTH=3840
HEIGHT=2160
FRAME_RATE=24
COLOR_DEPTH=12
CFA_PATTERN=RGGB

# Recording Mode & Formatting
CODEC=CinemaDNG
SECTOR_ALIGNMENT=4096
USE_O_DIRECT=1
RING_BUFFER_SLOTS=8

# Camera Identification Tags
DNG_MAKE="CinemaDNG"
DNG_MODEL="Ninja V RAW"
DNG_UNIQUE_MODEL="CinemaDNG"

# Dynamic Range Levels
BLACK_LEVEL=0
WHITE_LEVEL=4095

# IPC Sockets
PRIMARY_SOCKET="/var/run/user/1000/atomos/video_pipeline_socket"
FALLBACK_SOCKET="/var/run/atomos/video_pipeline_socket"

# Storage Paths (Relative to SSD mount point)
CLIPS_DIR="verdanove/clips"
LOGS_DIR="verdanove/logs"
